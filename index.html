<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO title and description: keep in sync with src/seo/structuredData.js (tests/seo.test.js checks). -->
    <title>Dermatologist in Karur & Velayuthampalayam | Abi Skin & Hair Clinic</title>
    <meta name="description" content="Dr. G. Srinivasan (MBBS, DD): skin, hair & laser clinic in Karur & Velayuthampalayam for acne, hair loss, psoriasis, vitiligo & laser hair removal. Book online." />
    <meta name="author" content="Dr. G. Srinivasan" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://abiskinandhaircare.in/" />
    <meta name="theme-color" content="#0f1c3f" />

    <!-- /admin is the doctor dashboard (also the ABI Doctor app): keep it out of search results and
         hide the prerendered public page there until the dashboard renders (src/main.jsx). -->
    <script>
      if (location.pathname.startsWith('/admin')) {
        document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex, nofollow');
        document.documentElement.classList.add('admin-route');
      }
    </script>
    <style>.admin-route #root { display: none; }</style>

    <!-- Open Graph for Social Sharing (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="Dermatologist in Karur & Velayuthampalayam | Dr. Srinivasan's Abi Skin & Hair Clinic" />
    <meta property="og:description" content="Doctor-led skin, hair and laser care by Dr. G. Srinivasan (MBBS, DD) in Karur and Velayuthampalayam. Book an appointment online." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abiskinandhaircare.in/" />
    <meta property="og:image" content="https://abiskinandhaircare.in/clinic_preview.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Entrance of Dr. Srinivasan's Abi Skin & Hair Clinic, Velayuthampalayam" />
    <meta property="og:site_name" content="Dr. Srinivasan's Abi Skin & Hair Clinic" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dermatologist in Karur & Velayuthampalayam | Dr. Srinivasan's Abi Skin & Hair Clinic" />

    <!-- Schema.org JSON-LD is generated from src/seo/structuredData.js and added at build time (scripts/prerender.js). -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
