<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ABI Doctor – Offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #020617; color: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0; }
    button { margin-top: 24px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
      color: #fff; background: #0d9488; }
    svg { color: #2dd4bf; }
  </style>
</head>
<body>
  <main>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/>
      <path d="M19 12.86a10 10 0 0 0-2-1.53"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
      <path d="m2 2 20 20"/>
    </svg>
    <h1>Cannot reach the clinic server</h1>
    <p>Check your mobile data or Wi-Fi. The dashboard will reload automatically when you are back online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    const DASHBOARD_URL = 'https://abiskinandhaircare.in/admin';
    const retry = () => { window.location.replace(DASHBOARD_URL); };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
